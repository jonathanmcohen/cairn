services:
  cairn:
    build: .
    image: cairn:dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://cairn:${DB_PASSWORD}@db:5432/cairn
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${PUBLIC_URL}
      COLLAB_URL: ${COLLAB_URL:-ws://localhost:1234}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      CAIRN_MAX_UPLOAD_MB: 25
      CAIRN_TRASH_RETENTION_DAYS: 30
      CAIRN_LOG_LEVEL: info
    volumes:
      - cairn_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  cairn-collab:
    build:
      context: .
      dockerfile: Dockerfile.collab
    image: cairn-collab:dev
    restart: unless-stopped
    ports:
      - "${COLLAB_PORT:-1234}:1234"
    environment:
      DATABASE_URL: postgres://cairn:${DB_PASSWORD}@db:5432/cairn
      AUTH_SECRET: ${AUTH_SECRET}
      COLLAB_PORT: 1234
    depends_on:
      db:
        condition: service_healthy

  db:
    # pgvector/pgvector:pg16 since v0.7.0 P11 — the embedding pipeline runs
    # `CREATE EXTENSION IF NOT EXISTS vector` at first migration, which the
    # plain postgres:16-alpine image does not ship. CI services + the
    # Testcontainers helper use the same image; compose follows suit so
    # `docker compose up` against a clean volume completes migrations.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: cairn
    volumes:
      - cairn_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional S3-compatible object store for FILE_BACKEND=s3. Only starts with
  # `docker compose --profile s3 up` — the default stack is unaffected.
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  cairn_uploads:
  cairn_db:
  minio-data:
