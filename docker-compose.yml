services:
  cairn:
    # Published by .github/workflows/release.yml on every `v*.*.*` tag.
    # Multi-arch (linux/amd64 + linux/arm64) manifest list. Pin via
    # CAIRN_VERSION in .env (e.g. CAIRN_VERSION=0.8.0); defaults to
    # `latest` for unpinned dev/preview deploys.
    image: ghcr.io/jonathanmcohen/cairn:${CAIRN_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://cairn:${DB_PASSWORD}@db:5432/cairn
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${PUBLIC_URL}
      COLLAB_URL: ${COLLAB_URL:-ws://localhost:1234}
      # v0.9.15 #A3 — internal HTTP base for pushing API content writes into the
      # live Yjs doc (same host:port as the collab WS server, over http). On the
      # compose network the collab service is reachable by name.
      CAIRN_COLLAB_INTERNAL_URL: ${CAIRN_COLLAB_INTERNAL_URL:-http://cairn-collab:1234}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      CAIRN_MAX_UPLOAD_MB: 25
      CAIRN_TRASH_RETENTION_DAYS: 30
      CAIRN_LOG_LEVEL: info
    volumes:
      - cairn_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  cairn-collab:
    # Sister image built from Dockerfile.collab in the same release
    # workflow. Version-locked to cairn via the shared CAIRN_VERSION
    # env so the two services never drift across major bumps.
    image: ghcr.io/jonathanmcohen/cairn-collab:${CAIRN_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${COLLAB_PORT:-1234}:1234"
    environment:
      DATABASE_URL: postgres://cairn:${DB_PASSWORD}@db:5432/cairn
      AUTH_SECRET: ${AUTH_SECRET}
      COLLAB_PORT: 1234
    depends_on:
      db:
        condition: service_healthy

  db:
    # ghcr.io/jonathanmcohen/pgvector:18-0.8.6 - Postgres 18 +
    # pgvector compiled in, built and published by the pgvector repo at
    # github.com/jonathanmcohen/pgvector. v0.7.0 P11 added
    # a migration that runs `CREATE EXTENSION IF NOT EXISTS vector`, so
    # the bare postgres image is not enough. Every consumer (CI services,
    # Testcontainers, compose) points at the same ref.
    image: ghcr.io/jonathanmcohen/pgvector:18-0.8.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: cairn
    volumes:
      # Postgres 18's official image moved PGDATA from
      # /var/lib/postgresql/data → /var/lib/postgresql/18/docker and
      # declares the VOLUME at /var/lib/postgresql (the parent). Mount
      # the parent so the per-major data dir lands inside the named
      # volume; this also keeps future major bumps (19, 20…) compatible
      # without changing the volume contract.
      - cairn_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional S3-compatible object store for FILE_BACKEND=s3. Only starts with
  # `docker compose --profile s3 up` — the default stack is unaffected.
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  cairn_uploads:
  cairn_db:
  minio-data:
