name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://cairn:cairn@localhost:5432/cairn_test
      AUTH_SECRET: ci-only-secret-not-used-in-production-padding-padding
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
        env:
          # v0.7.0 codebase trips Node's default ~2GB old-space limit; tsc OOMs
          # (exit 134, "Ineffective mark-compacts near heap limit"). 6 GB on
          # ubuntu-latest's ~7 GB box is plenty without crowding the runner.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Test
        run: pnpm test
        env:
          # Testcontainers in CI runs against the docker-in-docker provided by ubuntu-latest.
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Build smoke
        run: pnpm build

  security:
    runs-on: ubuntu-latest
    # gitleaks-action calls the PR REST API to scope the scan and (optionally)
    # post review comments — both require pull-requests: write on top of the
    # default contents: read. Without these, the action throws
    # "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Supply-chain: fail on high/critical. The time-boxed ignore list is
      # honored by a small wrapper so un-fixable upstream advisories don't block
      # indefinitely (and expired ignores re-block).
      - name: pnpm audit (high+)
        run: |
          set -euo pipefail
          pnpm audit --audit-level=high --json > audit.json || true
          node scripts/check-audit.mjs audit.json audit-ci-ignore.json

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # gitleaks-action v2 now requires GITHUB_TOKEN for PR scans (breaking
          # change announced in the action's README — see the action's runtime
          # error message). The default GITHUB_TOKEN has read-only access to
          # the repo's pulls/issues which is what the action needs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Run the adversarial security suite explicitly (also runs in `pnpm test`).
      - name: security tests
        run: pnpm test tests/security

  a11y:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector:pg16 — v0.7.0 migration 0025 runs `CREATE EXTENSION
        # vector;`. The vanilla `postgres:16-alpine` image doesn't carry
        # pgvector, so the migration fails with "extension vector is not
        # available". Match the Testcontainers image (`pgvector/pgvector:pg16`)
        # used by the wider test suite.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://cairn:cairn@localhost:5432/cairn_test
      AUTH_SECRET: ci-only-secret-not-used-in-production-padding-padding
      NEXTAUTH_URL: http://localhost:3100
      A11Y_PORT: '3100'

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate test DB
        run: pnpm db:migrate

      # Cache the Playwright browser download keyed on the installed playwright
      # version + OS. Survives ephemeral-runner restarts via GHA's cache backend
      # (not local disk), so the next run skips the ~150MB Chromium download.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # Chromium-only; the audit doesn't need the full browser matrix.
      # `--with-deps` apt-installs the system libs Chromium needs on
      # ubuntu-latest.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: a11y gate
        run: pnpm test:a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
