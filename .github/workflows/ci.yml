name: CI

on:
  pull_request:
    paths-ignore:
      # Pure docs / markdown / legal — no app or test behavior touches.
      - 'docs/**'
      - '**/*.md'
      - LICENSE
      # Dev-environment dotfiles — IDE, git plumbing, node-version pin
      # (CI sets node-version explicitly via setup-node, so .nvmrc is
      # advisory only).
      - .editorconfig
      - .gitignore
      - .gitattributes
      - .nvmrc
      - .dockerignore
      # Compose stack used for local + production deploy, not CI.
      - docker-compose.yml
      # Lighthouse CI config — read by .github/workflows/lighthouse.yml,
      # which runs on workflow_run after CI. Editing the config doesn't
      # need to re-trigger CI.
      - .lighthouserc.json
      # Postgres-pgvector base image lives behind its own publish
      # workflow at .github/workflows/postgres-pgvector-image.yml.
      - 'docker/postgres-pgvector/**'
      # Other GH metadata.
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/dependabot.yml'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      # Sibling workflows that don't influence CI behavior.
      - '.github/workflows/lighthouse.yml'
      - '.github/workflows/postgres-pgvector-image.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths-ignore:
      # Pure docs / markdown / legal — no app or test behavior touches.
      - 'docs/**'
      - '**/*.md'
      - LICENSE
      # Dev-environment dotfiles — IDE, git plumbing, node-version pin
      # (CI sets node-version explicitly via setup-node, so .nvmrc is
      # advisory only).
      - .editorconfig
      - .gitignore
      - .gitattributes
      - .nvmrc
      - .dockerignore
      # Compose stack used for local + production deploy, not CI.
      - docker-compose.yml
      # Lighthouse CI config — read by .github/workflows/lighthouse.yml,
      # which runs on workflow_run after CI. Editing the config doesn't
      # need to re-trigger CI.
      - .lighthouserc.json
      # Postgres-pgvector base image lives behind its own publish
      # workflow at .github/workflows/postgres-pgvector-image.yml.
      - 'docker/postgres-pgvector/**'
      # Other GH metadata.
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/dependabot.yml'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      # Sibling workflows that don't influence CI behavior.
      - '.github/workflows/lighthouse.yml'
      - '.github/workflows/postgres-pgvector-image.yml'
      - '.github/workflows/release.yml'

# Workflow-wide heap bump for Node steps. v0.7.0 codebase trips Node's default
# ~2 GB old-space limit on multiple steps (tsc, Next build via Turbopack/SWC,
# Vitest). 6 GB on ubuntu-latest's ~7 GB box is plenty without crowding the
# runner. Applied via process env so every spawned `node`/`pnpm`/`tsx`
# inherits it.
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  ci:
    runs-on: ubuntu-latest
    # ghcr.io/jonathanmcohen/postgres-pgvector is a private package; the
    # Testcontainers helper pulls it on `pnpm test`. `packages: read` lets
    # the docker login step exchange GITHUB_TOKEN for a pull-capable creds
    # blob against GHCR.
    permissions:
      contents: read
      packages: read
    env:
      DATABASE_URL: postgres://cairn:cairn@localhost:5432/cairn_test
      AUTH_SECRET: ci-only-secret-not-used-in-production-padding-padding
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Hard gate: no NEW hardcoded user-facing strings outside the baseline.
      # Baseline lives at i18n-audit.baseline.json — bump it by running
      # `pnpm i18n:baseline` after lifting strings into messages/en.json.
      - name: i18n hardcoded-string check
        run: pnpm i18n:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build smoke
        # Self-hosted runners persist .next/ between runs. A stale standalone
        # bundle from a prior commit can include source .ts files that Next 16's
        # NFT tracer has since started excluding — Node 22 then loads those .ts
        # files at runtime and crashes. Clean before each build to dodge that.
        run: rm -rf .next && pnpm build

  # Vitest suite, one job per top-level test directory.
  # Each job is serial within itself (Testcontainers maxWorkers 1) but the
  # jobs run in parallel across GitHub-hosted runners (public repo) — improving
  # log locality and triage speed vs the old 2-shard approach.
  #
  # COVERAGE INVARIANT: this matrix must run EVERY Vitest dir the old
  # `pnpm test --shard` covered, or those tests silently stop running.
  # Excluded ON PURPOSE (run elsewhere): `security` (dedicated `security` job),
  # `a11y` + `e2e` (Playwright, run by the `a11y` job / pnpm test:a11y),
  # `helpers` (shared helpers, no test files).
  # `server` folds in BOTH tests/server AND src/server (the vitest include
  # also matches src/server/**/*.test.ts — it must land in a job).
  # New-but-empty dirs (blocks/workflow/settings/ui) are listed so .spec.ts
  # files added by Plans A–U run automatically; vitest exits 0 on no files.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: api,         path: tests/api }
          - { name: app,         path: tests/app }
          - { name: blocks,      path: tests/blocks }
          - { name: collab,      path: tests/collab }
          - { name: components,  path: tests/components }
          - { name: db,          path: tests/db }
          - { name: e2e-flag,    path: tests/e2e-flag }
          - { name: i18n,        path: tests/i18n }
          - { name: integration, path: tests/integration }
          - { name: lib,         path: tests/lib }
          - { name: openapi,     path: tests/openapi }
          - { name: pwa,         path: tests/pwa }
          - { name: scripts,     path: tests/scripts }
          - { name: server,      path: "tests/server src/server" }
          - { name: settings,    path: tests/settings }
          - { name: siem,        path: tests/siem }
          - { name: styles,      path: tests/styles }
          - { name: suggestions, path: tests/suggestions }
          - { name: ui,          path: tests/ui }
          - { name: unit,        path: tests/unit }
          - { name: workflow,    path: tests/workflow }
    env:
      DATABASE_URL: postgres://cairn:cairn@localhost:5432/cairn_test
      AUTH_SECRET: ci-only-secret-not-used-in-production-padding-padding
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Auth the docker daemon to GHCR so Testcontainers can pull the private
      # postgres-pgvector image during `pnpm vitest run`.
      - name: GHCR login (Testcontainers image)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test (${{ matrix.suite.name }})
        run: pnpm vitest run ${{ matrix.suite.path }} --reporter=dot
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  security:
    runs-on: ubuntu-latest
    # gitleaks-action calls the PR REST API to scope the scan and (optionally)
    # post review comments — both require pull-requests: write on top of the
    # default contents: read. Without these, the action throws
    # "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # gitleaks scans history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Supply-chain: fail on high/critical. The time-boxed ignore list is
      # honored by a small wrapper so un-fixable upstream advisories don't block
      # indefinitely (and expired ignores re-block).
      - name: pnpm audit (high+)
        run: |
          set -euo pipefail
          pnpm audit --audit-level=high --json > audit.json || true
          node scripts/check-audit.mjs audit.json audit-ci-ignore.json

      # gitleaks-action downloads gitleaks binary to /tmp/gitleaks.tmp
      # before unpacking. /tmp on self-hosted runners persists between
      # jobs; a leftover from a prior failed run trips the action's
      # download-destination-exists guard. Clean it before invoking.
      - name: Clean stale gitleaks download (self-hosted /tmp persists)
        run: rm -f /tmp/gitleaks.tmp

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # gitleaks-action v2 now requires GITHUB_TOKEN for PR scans (breaking
          # change announced in the action's README — see the action's runtime
          # error message). The default GITHUB_TOKEN has read-only access to
          # the repo's pulls/issues which is what the action needs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Run the adversarial security suite explicitly (also runs in `pnpm test`).
      - name: security tests
        run: pnpm test tests/security

  a11y:
    runs-on: ubuntu-latest
    # Private GHCR image needs packages: read for the services credentials
    # block + the explicit docker login step (used by the Playwright web
    # server which spawns its own db:migrate before pnpm test:a11y).
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        # ghcr.io/jonathanmcohen/postgres-pgvector:18-alpine — Postgres 18 +
        # pgvector built in-house (docker/postgres-pgvector/Dockerfile,
        # published by the postgres-pgvector-image workflow). Every
        # consumer (CI services, Testcontainers, compose) points at the
        # same ref so the dev/test/CI matrix doesn't drift.
        image: ghcr.io/jonathanmcohen/postgres-pgvector:18-alpine
        # Private GHCR package — runner has to authenticate to pull the
        # service image before the job starts.
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://cairn:cairn@localhost:5432/cairn_test
      AUTH_SECRET: ci-only-secret-not-used-in-production-padding-padding
      NEXTAUTH_URL: http://localhost:3100
      A11Y_PORT: '3100'

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate test DB
        run: pnpm db:migrate

      # Cache the Playwright browser download keyed on the installed playwright
      # version + OS. Survives ephemeral-runner restarts via GHA's cache backend
      # (not local disk), so the next run skips the ~150MB Chromium download.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # Chromium-only; the audit doesn't need the full browser matrix.
      # `--with-deps` apt-installs the system libs Chromium needs on
      # ubuntu-latest.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        # Self-hosted runners persist .next/ between runs. A stale standalone
        # bundle from a prior commit can include source .ts files that Next 16's
        # NFT tracer has since started excluding — the a11y webServer then loads
        # those .ts at runtime and chokes on `next/headers` resolution. Clean
        # before each build to dodge that. Mirrors the ci job's Build smoke step.
        run: rm -rf .next && pnpm build

      - name: a11y gate
        run: pnpm test:a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
