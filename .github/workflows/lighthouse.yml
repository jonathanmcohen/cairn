name: Lighthouse CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Same heap bump as CI.
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  lhci:
    # Run only when the CI workflow that triggered us actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # packages: read so the runner can pull the private GHCR
    # postgres-pgvector image declared as a service below.
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        # ghcr.io/jonathanmcohen/postgres-pgvector:18-alpine — matches CI
        # services + Testcontainers + compose. See
        # docker/postgres-pgvector/Dockerfile.
        image: ghcr.io/jonathanmcohen/postgres-pgvector:18-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn_lhci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://cairn:cairn@localhost:5432/cairn_lhci
      AUTH_SECRET: lhci-only-secret-padding-padding-padding
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Migrate
        run: pnpm exec tsx src/db/migrate.ts

      - name: Seed LHCI fixture
        run: pnpm exec tsx scripts/seed-lhci.ts

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-reports
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
