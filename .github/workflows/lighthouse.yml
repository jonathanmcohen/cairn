name: Lighthouse CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Same heap bump as CI.
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  lhci:
    # Run only when the CI workflow that triggered us actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # packages: read so the runner can pull the private GHCR
    # pgvector image declared as a service below.
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        # ghcr.io/jonathanmcohen/pgvector:18-0.8.6 - matches CI
        # services + Testcontainers + compose. See
        # github.com/jonathanmcohen/pgvector.
        image: ghcr.io/jonathanmcohen/pgvector:18-0.8.6
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn_lhci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://cairn:cairn@localhost:5432/cairn_lhci
      AUTH_SECRET: lhci-only-secret-padding-padding-padding
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Migrate
        run: pnpm exec tsx src/db/migrate.ts

      - name: Seed LHCI fixture
        run: pnpm exec tsx scripts/seed-lhci.ts

      # Self-hosted runners don't ship Chrome the way GHA-hosted ones do.
      # lhci's healthcheck fails ("Chrome installation not found") without
      # an explicit install. setup-chrome drops a versioned binary on the
      # runner and exports CHROME_PATH so lhci's default lookup finds it.
      - name: Install Chrome for Lighthouse
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun
        env:
          # lhci healthcheck warns 'GitHub token not set' when this is
          # absent; LHCI_GITHUB_APP_TOKEN posts a commit status with the
          # budget result. Using the workflow's GITHUB_TOKEN is fine.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit Chrome path from setup-chrome's output so lhci's
          # autodetect can't pick the wrong (or missing) binary.
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lhci-reports
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
