name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

# Multi-arch (linux/amd64 + linux/arm64) built on NATIVE runners — no QEMU
# emulation (which deadlocked on the heavier image). Each arch builds on its own
# native runner and pushes an arch-specific tag; a per-image merge job then
# assembles the multi-arch manifest list under the real tags. A final job cuts
# the GitHub Release once. (Arch-specific tags push reliably on GHCR, unlike
# push-by-digest, which isn't addressable before a tagged manifest exists.)

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cairn
            dockerfile: Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: [self-hosted, X64]
          - image: cairn
            dockerfile: Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: [self-hosted, ARM64]
          - image: cairn-collab
            dockerfile: Dockerfile.collab
            platform: linux/amd64
            arch: amd64
            runner: [self-hosted, X64]
          - image: cairn-collab
            dockerfile: Dockerfile.collab
            platform: linux/arm64
            arch: arm64
            runner: [self-hosted, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arch-specific tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          provenance: ${{ github.event.repository.visibility == 'public' }}
          sbom: ${{ github.event.repository.visibility == 'public' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [cairn, cairn-collab]
    steps:
      - name: Extract version from tag
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          echo "major=${major}" >> "$GITHUB_OUTPUT"
          echo "majorminor=${major}.${minor}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.majorminor }}
            type=raw,value=${{ steps.ver.outputs.major }}
            type=raw,value=latest,enable=${{ !contains(steps.ver.outputs.version, '-') }}

      - name: Create multi-arch manifest list and push
        env:
          IMG: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${IMG}:${VER}-amd64" "${IMG}:${VER}-arm64"

      - name: Resolve pushed manifest digest
        id: digest
        env:
          IMG: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          d=$(docker buildx imagetools inspect "${IMG}:${VER}" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${d}" >> "$GITHUB_OUTPUT"

      # SLSA provenance attestation requires the GitHub attestations API, which is
      # unavailable for user-owned PRIVATE repos — gate it on public visibility so
      # a private repo still builds + publishes.
      - name: Attest
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  release:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          body: |
            Multi-arch container images (linux/amd64 + linux/arm64):
            - `ghcr.io/${{ github.repository_owner }}/cairn:${{ steps.ver.outputs.version }}`
            - `ghcr.io/${{ github.repository_owner }}/cairn-collab:${{ steps.ver.outputs.version }}`

            Deploy (3 containers: cairn, cairn-collab, db) — see docker-compose.yml.

            See [CHANGELOG.md](CHANGELOG.md) for the full feature list.
