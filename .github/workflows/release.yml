name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          echo "major=${major}" >> "$GITHUB_OUTPUT"
          echo "majorminor=${major}.${minor}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cairn
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.majorminor }}
            type=raw,value=${{ steps.ver.outputs.major }}
            type=raw,value=latest,enable=${{ !contains(steps.ver.outputs.version, '-') }}

      # SLSA provenance + SBOM attestation require the GitHub attestations API,
      # which is unavailable for user-owned PRIVATE repos. Gate all supply-chain
      # metadata on the repo being public so a private repo still builds + publishes.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event.repository.visibility == 'public' }}
          sbom: ${{ github.event.repository.visibility == 'public' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cairn
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Docker meta (collab)
        id: meta_collab
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cairn-collab
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.majorminor }}
            type=raw,value=${{ steps.ver.outputs.major }}
            type=raw,value=latest,enable=${{ !contains(steps.ver.outputs.version, '-') }}

      - name: Build and push (collab)
        id: build_collab
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.collab
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_collab.outputs.tags }}
          labels: ${{ steps.meta_collab.outputs.labels }}
          provenance: ${{ github.event.repository.visibility == 'public' }}
          sbom: ${{ github.event.repository.visibility == 'public' }}
          cache-from: type=gha,scope=collab
          cache-to: type=gha,mode=max,scope=collab

      - name: Attest (collab)
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cairn-collab
          subject-digest: ${{ steps.build_collab.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          body: |
            Container images:
            - `ghcr.io/${{ github.repository_owner }}/cairn:${{ steps.ver.outputs.version }}`
            - `ghcr.io/${{ github.repository_owner }}/cairn-collab:${{ steps.ver.outputs.version }}`

            Deploy (3 containers: cairn, cairn-collab, db) — see docker-compose.yml.

            See [CHANGELOG.md](CHANGELOG.md) for the full feature list.
