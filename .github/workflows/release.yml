name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

# Multi-arch (linux/amd64 + linux/arm64) built on GitHub-hosted NATIVE runners
# — no QEMU emulation (which deadlocked on the heavier image). amd64 builds on
# `ubuntu-latest`; arm64 builds on `ubuntu-24.04-arm`. Each arch builds on its
# own runner and pushes an arch-specific tag; a per-image merge job assembles
# the multi-arch manifest list under the real tags. A final job cuts the
# GitHub Release once.

jobs:
  # Gate 4 (v0.9.18 release gates — docs/superpowers/v0.9.18/gates.md).
  # Block the whole publish pipeline until every carry-forward item for THIS
  # release is closed on GitHub. The label is derived from the tag
  # (e.g. tag `v0.9.18` -> label `v0.9.18`), so the gate is reusable per
  # release without editing this file. Skipped for prerelease tags
  # (`vX.Y.Z-rcN`), which are pre-verification builds by design.
  # NOTE: requires the GitHub CLI (`gh`) on PATH and an issue label matching
  # the tag; fails closed if `gh` is missing (intended — never silently pass).
  verify-carry-forward-closed:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: All carry-forward items for this release must be closed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LABEL: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          open_items=$(gh issue list \
            --repo "$REPO" \
            --label "$LABEL" \
            --label carry-forward \
            --state open \
            --json number \
            --jq '.[].number' | tr '\n' ' ')
          if [ -n "$open_items" ]; then
            echo "::error::Carry-forward items still open for ${LABEL}: ${open_items}"
            echo "Close each tracked item (or drop the carry-forward label) before tagging."
            exit 1
          fi
          echo "No open carry-forward items for ${LABEL} — Gate 4 passed."

  build:
    needs: verify-carry-forward-closed
    # The gate job is SKIPPED for prerelease tags (-rcN) by design — but a
    # skipped `needs` skips dependents by default, which silently killed RC
    # builds. Run when the gate passed OR was skipped; never after a failure.
    if: ${{ !cancelled() && (needs.verify-carry-forward-closed.result == 'success' || needs.verify-carry-forward-closed.result == 'skipped') }}
    # GitHub-hosted NATIVE runners per arch (public repo): amd64 on
    # ubuntu-latest, arm64 on ubuntu-24.04-arm. No QEMU emulation either way.
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cairn
            dockerfile: Dockerfile
            platform: linux/amd64
            arch: amd64
          - image: cairn
            dockerfile: Dockerfile
            platform: linux/arm64
            arch: arm64
          - image: cairn-collab
            dockerfile: Dockerfile.collab
            platform: linux/amd64
            arch: amd64
          - image: cairn-collab
            dockerfile: Dockerfile.collab
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arch-specific tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          provenance: ${{ github.event.repository.visibility == 'public' }}
          sbom: ${{ github.event.repository.visibility == 'public' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  merge:
    needs: build
    # A skipped job propagates TRANSITIVELY: the rc-skipped gate poisoned the
    # default success() here even though build itself ran (its `if` rescues
    # only build, not dependents). Check build's own result explicitly.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [cairn, cairn-collab]
    steps:
      - name: Extract version from tag
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          echo "major=${major}" >> "$GITHUB_OUTPUT"
          echo "majorminor=${major}.${minor}" >> "$GITHUB_OUTPUT"

      # Self-hosted Linux runner may not ship jq. The manifest-merge step
      # uses jq to parse DOCKER_METADATA_OUTPUT_JSON into `-t <tag>` args
      # for `docker buildx imagetools create`. Drop in a static jq binary
      # if the runner's PATH doesn't already have one.
      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            curl -sSL https://github.com/jqlang/jq/releases/latest/download/jq-linux-amd64 \
              -o "$RUNNER_TEMP/jq"
            chmod +x "$RUNNER_TEMP/jq"
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            # Rolling tags (0.9 / 0 / latest) must never point at a prerelease.
            type=raw,value=${{ steps.ver.outputs.majorminor }},enable=${{ !contains(steps.ver.outputs.version, '-') }}
            type=raw,value=${{ steps.ver.outputs.major }},enable=${{ !contains(steps.ver.outputs.version, '-') }}
            type=raw,value=latest,enable=${{ !contains(steps.ver.outputs.version, '-') }}

      - name: Create multi-arch manifest list and push
        env:
          IMG: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${IMG}:${VER}-amd64" "${IMG}:${VER}-arm64"

      - name: Resolve pushed manifest digest
        id: digest
        env:
          IMG: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          d=$(docker buildx imagetools inspect "${IMG}:${VER}" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${d}" >> "$GITHUB_OUTPUT"

      # SLSA provenance attestation requires the GitHub attestations API, which is
      # unavailable for user-owned PRIVATE repos — gate it on public visibility so
      # a private repo still builds + publishes.
      - name: Attest
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  release:
    needs: merge
    # Same transitive-skip hazard as merge — check the direct dependency only.
    if: ${{ !cancelled() && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          body: |
            Multi-arch container images (linux/amd64 + linux/arm64):
            - `ghcr.io/${{ github.repository_owner }}/cairn:${{ steps.ver.outputs.version }}`
            - `ghcr.io/${{ github.repository_owner }}/cairn-collab:${{ steps.ver.outputs.version }}`

            Deploy (3 containers: cairn, cairn-collab, db) — see docker-compose.yml.

            See [CHANGELOG.md](CHANGELOG.md) for the full feature list.
